<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockPilot — Gestion intelligente</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--ink:#17243a;--muted:#758198;--blue:#356df3;--blue2:#eaf0ff;--line:#e7ecf3;--green:#16a36a;--red:#e45151;--orange:#f0a12e;--nav:#14233b}
*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink}
);display:flex;min-height:100vh}aside{width:238px;background:var(--nav);color:#eaf0ff;padding:22px 16px;display:flex;flex-direction:column;gap:26px;flex-shrink:0}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;padding:4px 8px}.logo{background:#356df3;border-radius:10px;padding:8px}.nav-label{font-size:10px;letter-spacing:1.5px;color:#8291ad;padding:0 10px;margin-bottom:8px}.nav button{width:100%;text-align:left;background:none;border:0;color:#b8c5dc;padding:11px 12px;border-radius:9px;cursor:pointer;margin:2px 0;font:inherit}.nav button.active,.nav button:hover{background:#263a5b;color:white}.aside-bottom{margin-top:auto;color:#92a3bf;font-size:12px;padding:10px}.main{flex:1;min-width:0;padding:26px 30px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:14px}.top h1{margin:0;font-size:24px}.subtitle{color:var(--muted);margin-top:5px}.actions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:#fff;padding:10px 13px;border-radius:9px;cursor:pointer;color:var(--ink);font-weight:600}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn:hover{filter:brightness(.97)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px}.kpi-label{color:var(--muted);font-size:12px}.kpi{font-size:25px;font-weight:750;margin:10px 0 7px}.kpi-foot{font-size:12px;color:var(--muted)}.kpi-foot.good{color:var(--green)}.kpi-foot.warn{color:var(--orange)}.section-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(270px,1fr);gap:15px;margin-top:16px}.section-title{font-size:15px;font-weight:750;margin:0 0 14px}.chart-area{height:210px;display:flex;align-items:end;gap:14px;padding:12px 8px 0;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 49px,#f0f3f8 50px)}.barwrap{flex:1;display:flex;align-items:end;justify-content:center;height:100%;gap:3px}.bar{width:35%;min-width:7px;background:#a9c1ff;border-radius:5px 5px 0 0}.bar:nth-child(2){background:#356df3}.chart-labels{display:flex;justify-content:space-around;color:var(--muted);font-size:11px;margin-top:8px}.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}.alert:last-child{border:0}.alert-icon{background:#fff1df;color:#bd7a17;padding:7px;border-radius:8px}.alert strong{display:block;font-size:13px;margin-bottom:3px}.alert small{color:var(--muted)}.table-card{margin-top:16px}.table-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.search{border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-width:210px;outline:none}.search:focus{border-color:var(--blue)}table{width:100%;border-collapse:collapse;margin-top:13px}th{text-align:left;color:var(--muted);font-size:11px;font-weight:650;padding:11px 8px;border-bottom:1px solid var(--line)}td{padding:12px 8px;border-bottom:1px solid #f0f3f7;font-size:13px}tr:last-child td{border-bottom:0}.tag{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:700}.tag.ok{background:#e8f8ef;color:#178350}.tag.low{background:#fff4df;color:#b97712}.tag.out{background:#ffebeb;color:#c63d3d}.product{font-weight:650}.sku{color:var(--muted);font-size:11px;margin-top:3px}.rowbtn{border:1px solid var(--line);background:white;border-radius:6px;padding:5px 8px;cursor:pointer;margin-right:3px}.empty{padding:28px;text-align:center;color:var(--muted)}.modal-bg{position:fixed;inset:0;background:#101c30a8;display:none;align-items:center;justify-content:center;padding:15px;z-index:5}.modal{background:#fff;border-radius:15px;padding:22px;width:min(470px,100%);box-shadow:0 18px 55px #0003}.modal h2{margin:0 0 17px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}.field input,.field select{padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.notice{font-size:12px;color:var(--muted);margin-top:10px}.toast{position:fixed;bottom:20px;right:20px;background:#17263d;color:white;padding:12px 16px;border-radius:10px;display:none;box-shadow:0 5px 20px #0002}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.section-grid{grid-template-columns:1fr}}@media(max-width:720px){aside{width:66px;padding:15px 8px}.brand{font-size:0;justify-content:center;padding:0}.logo{font-size:16px}.nav-label{display:none}.nav button{font-size:0;text-align:center;padding:13px 5px}.nav button::first-letter{font-size:18px}.aside-bottom{display:none}.main{padding:18px 13px}.top{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr 1fr;gap:9px}.card{padding:13px}.kpi{font-size:20px}.table-card{overflow-x:auto}table{min-width:680px}.section-grid{grid-template-columns:1fr}} 
</style>
</head>
<body>
<aside>
 <div class="brand"><span class="logo">📦</span> StockPilot</div>
 <div class="nav"><div class="nav-label">ESPACE DE TRAVAIL</div>
  <button class="active" onclick="switchView('dashboard')">▦ &nbsp; Dashboard</button>
  <button onclick="switchView('products')">▣ &nbsp; Produits</button>
  <button onclick="switchView('movements')">⇄ &nbsp; Mouvements</button>
  <button onclick="switchView('alerts')">⚠ &nbsp; Alertes stock</button>
 </div>
 <div class="aside-bottom">StockPilot · édition locale<br>Gestion intelligente des stocks</div>
</aside>
<div class="main">
 <div class="top"><div><h1 id="pageTitle">Dashboard</h1><div class="subtitle" id="pageSub">Vue d'ensemble de votre inventaire</div></div><div class="actions"><button class="btn" onclick="exportCSV()">↓ Export CSV</button><button class="btn primary" onclick="openProductModal()">＋ Ajouter un produit</button></div></div>
 <div id="view"></div>
</div>
<div class="modal-bg" id="modalBg"><div class="modal"><h2 id="modalTitle">Ajouter un produit</h2><form id="productForm"><div class="formgrid">
 <div class="field full"><label>Nom du produit</label><input id="pName" required placeholder="Ex. Carton d'emballage"></div>
 <div class="field"><label>Référence (SKU)</label><input id="pSku" required placeholder="REF-001"></div>
 <div class="field"><label>Catégorie</label><input id="pCat" placeholder="Ex. Fournitures"></div>
 <div class="field"><label>Prix unitaire (€)</label><input id="pPrice" type="number" min="0" step=".01" required></div>
 <div class="field"><label>Quantité en stock</label><input id="pQty" type="number" min="0" step="1" required></div>
 <div class="field"><label>Seuil d'alerte</label><input id="pMin" type="number" min="0" step="1" value="5"></div>
 <div class="field"><label>Emplacement</label><input id="pLoc" placeholder="Ex. A-01"></div>
 </div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div></form></div></div>
<div class="toast" id="toast"></div>
<script>
const STORAGE='stockpilot_enterprise_v1';
let products=[], movements=[], editId=null, viewMode='dashboard';
function seed(){return [
{id:1,name:'Clavier mécanique',sku:'ACC-001',cat:'Accessoires',price:89.99,qty:24,min:8,loc:'A-01'},
{id:2,name:'Souris sans fil',sku:'ACC-002',cat:'Accessoires',price:49.9,qty:6,min:10,loc:'A-02'},
{id:3,name:'Écran 27 pouces',sku:'MON-001',cat:'Écrans',price:279,qty:12,min:4,loc:'B-01'},
{id:4,name:'SSD 1 To',sku:'STO-001',cat:'Stockage',price:79.9,qty:3,min:8,loc:'C-02'},
{id:5,name:'Casque audio',sku:'AUD-001',cat:'Audio',price:129,qty:18,min:5,loc:'A-03'},
{id:6,name:'Webcam HD',sku:'CAM-001',cat:'Accessoires',price:59.9,qty:0,min:5,loc:'A-04'},
{id:7,name:'RAM 16 Go',sku:'MEM-001',cat:'Composants',price:45,qty:15,min:6,loc:'C-01'},
{id:8,name:'Hub USB-C',sku:'ACC-003',cat:'Accessoires',price:34.9,qty:4,min:7,loc:'A-05'}]}
function load(){try{const d=JSON.parse(localStorage.getItem(STORAGE));products=d?.products||seed();movements=d?.movements||[]}catch{products=seed();movements=[]}}
function save(){localStorage.setItem(STORAGE,JSON.stringify({products,movements}))}
const euro=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n||0);
const stockStatus=p=>p.qty===0?['Rupture','out']:p.qty<=p.min?['Stock faible','low']:['En stock','ok'];
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2300)}
function addMovement(p,delta,type='Ajustement',note=''){movements.unshift({id:Date.now(),date:new Date().toISOString(),name:p.name,sku:p.sku,delta,type,note});p.qty=Math.max(0,p.qty+delta);save()}
function switchView(mode){viewMode=mode;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));const idx={dashboard:0,products:1,movements:2,alerts:3}[mode];document.querySelectorAll('.nav button')[idx]?.classList.add('active');render()}
function render(){const title={dashboard:'Dashboard',products:'Produits',movements:'Mouvements de stock',alerts:'Alertes stock'};const sub={dashboard:"Vue d'ensemble de votre inventaire",products:"Gérez vos références, niveaux de stock et emplacements",movements:"Historique des entrées, sorties et ajustements",alerts:"Articles nécessitant une attention ou un réapprovisionnement"};document.getElementById('pageTitle').textContent=title[viewMode];document.getElementById('pageSub').textContent=sub[viewMode];
const quantity=products.reduce((s,p)=>s+p.qty,0), value=products.reduce((s,p)=>s+p.qty*p.price,0), low=products.filter(p=>p.qty>0&&p.qty<=p.min).length, out=products.filter(p=>p.qty===0).length;
const tableRows=(arr)=>arr.map(p=>{const [label,cls]=stockStatus(p);return `<tr><td><div class="product">${esc(p.name)}</div><div class="sku">${esc(p.sku)}</div></td><td>${esc(p.cat||'—')}</td><td>${esc(p.loc||'—')}</td><td>${euro(p.price)}</td><td><b>${p.qty}</b></td><td><span class="tag ${cls}">${label}</span></td><td><button class="rowbtn" title="Entrée stock" onclick="quickMove(${p.id},1)">＋</button><button class="rowbtn" title="Sortie stock" onclick="quickMove(${p.id},-1)">－</button><button class="rowbtn" title="Modifier" onclick="editProduct(${p.id})">✎</button><button class="rowbtn" title="Supprimer" onclick="deleteProduct(${p.id})">×</button></td></tr>`}).join('');
const table=`<div class="card table-card"><div class="table-head"><h3 class="section-title">Inventaire des produits</h3><input class="search" id="searchBox" placeholder="⌕ Rechercher produit..." oninput="filterTable(this.value)"></div><table><thead><tr><th>PRODUIT</th><th>CATÉGORIE</th><th>EMPLACEMENT</th><th>PRIX UNIT.</th><th>QUANTITÉ</th><th>ÉTAT</th><th>ACTIONS</th></tr></thead><tbody id="productsTbody">${tableRows(products)}</tbody></table><div class="notice">💡 Les actions + / − enregistrent un mouvement d'une unité. Utilisez Modifier pour ajuster les informations du produit.</div></div>`;
if(viewMode==='dashboard'){document.getElementById('view').innerHTML=`<div class="grid"><div class="card"><div class="kpi-label">Valeur du stock</div><div class="kpi">${euro(value)}</div><div class="kpi-foot">Valeur estimée à partir des prix unitaires</div></div><div class="card"><div class="kpi-label">Unités en stock</div><div class="kpi">${quantity.toLocaleString('fr-FR')}</div><div class="kpi-foot good">Sur ${products.length} références</div></div><div class="card"><div class="kpi-label">Stocks faibles</div><div class="kpi">${low}</div><div class="kpi-foot warn">À surveiller / recommander</div></div><div class="card"><div class="kpi-label">Ruptures</div><div class="kpi">${out}</div><div class="kpi-foot ${out?'warn':'good'}">${out?'Réapprovisionnement nécessaire':'Aucune rupture'}</div></div></div><div class="section-grid"><div class="card"><h3 class="section-title">Niveau de stock · par article</h3><div class="chart-area">${products.slice(0,12).map(p=>`<div class="barwrap" title="${esc(p.name)}: ${p.qty}"><div class="bar" style="height:${Math.max(3,Math.min(100,p.qty/(Math.max(...products.map(x=>x.qty),1))*100))}%"></div></div>`).join('')}</div><div class="chart-labels">${products.slice(0,6).map(p=>`<span>${esc(p.sku.slice(0,5))}</span>`).join('')}</div></div><div class="card"><h3 class="section-title">Alertes intelligentes</h3>${products.filter(p=>p.qty<=p.min).slice(0,6).map(p=>`<div class="alert"><div class="alert-icon">${p.qty===0?'⛔':'⚠️'}</div><div><strong>${esc(p.name)}</strong><small>${p.qty===0?'Rupture de stock':`Stock bas : ${p.qty} restant (seuil ${p.min})`}</small></div></div>`).join('')||'<div class="empty">Aucune alerte. Tout va bien !</div>'}</div></div>${table}`;
}else if(viewMode==='products'){document.getElementById('view').innerHTML=table}
else if(viewMode==='alerts'){const alerted=products.filter(p=>p.qty<=p.min);document.getElementById('view').innerHTML=`<div class="card"><h3 class="section-title">Réapprovisionnement suggéré</h3>${alerted.length?alerted.map(p=>`<div class="alert"><div class="alert-icon">${p.qty===0?'⛔':'⚠️'}</div><div style="flex:1"><strong>${esc(p.name)} (${esc(p.sku)})</strong><small>Disponible : ${p.qty} · Seuil : ${p.min} · Emplacement : ${esc(p.loc||'—')}</small></div><strong style="color:var(--blue)">Suggestion : ${Math.max(0,p.min*2-p.qty)} unités</strong></div>`).join(''):'<div class="empty">Aucune alerte à afficher.</div>'}</div>${table}`}
else if(viewMode==='movements'){document.getElementById('view').innerHTML=`<div class="card"><h3 class="section-title">Historique des mouvements</h3><table><thead><tr><th>DATE</th><th>ARTICLE</th><th>RÉFÉRENCE</th><th>TYPE</th><th>QUANTITÉ</th><th>NOTE</th></tr></thead><tbody>${movements.map(m=>`<tr><td>${new Date(m.date).toLocaleString('fr-FR')}</td><td class="product">${esc(m.name)}</td><td>${esc(m.sku)}</td><td>${esc(m.type)}</td><td style="color:${m.delta>=0?'var(--green)':'var(--red)'};font-weight:700">${m.delta>0?'+':''}${m.delta}</td><td>${esc(m.note||'—')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Pas encore de mouvement enregistré.</td></tr>'}</tbody></table></div>`}
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function filterTable(q){const tb=document.getElementById('productsTbody');if(!tb)return;const term=q.toLowerCase();const found=products.filter(p=>(p.name+' '+p.sku+' '+p.cat+' '+p.loc).toLowerCase().includes(term));tb.innerHTML=found.length?found.map(p=>{const [label,cls]=stockStatus(p);return `<tr><td><div class="product">${esc(p.name)}</div><div class="sku">${esc(p.sku)}</div></td><td>${esc(p.cat||'—')}</td><td>${esc(p.loc||'—')}</td><td>${euro(p.price)}</td><td><b>${p.qty}</b></td><td><span class="tag ${cls}">${label}</span></td><td><button class="rowbtn" onclick="quickMove(${p.id},1)">＋</button><button class="rowbtn" onclick="quickMove(${p.id},-1)">－</button><button class="rowbtn" onclick="editProduct(${p.id})">✎</button><button class="rowbtn" onclick="deleteProduct(${p.id})">×</button></td></tr>`}).join(''):'<tr><td colspan="7" class="empty">Aucun produit trouvé.</td></tr>'}
function openProductModal(){editId=null;document.getElementById('modalTitle').textContent='Ajouter un produit';document.getElementById('productForm').reset();document.getElementById('pMin').value=5;document.getElementById('modalBg').style.display='flex'}
function closeModal(){document.getElementById('modalBg').style.display='none'}
function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;editId=id;document.getElementById('modalTitle').textContent='Modifier le produit';[['pName',p.name],['pSku',p.sku],['pCat',p.cat],['pPrice',p.price],['pQty',p.qty],['pMin',p.min],['pLoc',p.loc]].forEach(([k,v])=>document.getElementById(k).value=v??'');document.getElementById('modalBg').style.display='flex'}
document.getElementById('productForm').addEventListener('submit',e=>{e.preventDefault();const p={name:document.getElementById('pName').value.trim(),sku:document.getElementById('pSku').value.trim(),cat:document.getElementById('pCat').value.trim(),price:Number(document.getElementById('pPrice').value),qty:Number(document.getElementById('pQty').value),min:Number(document.getElementById('pMin').value),loc:document.getElementById('pLoc').value.trim()};if(editId){const old=products.find(x=>x.id===editId);const change=p.qty-old.qty;Object.assign(old,p);if(change)movements.unshift({id:Date.now(),date:new Date().toISOString(),name:p.name,sku:p.sku,delta:change,type:'Modification directe',note:'Quantité ajustée via fiche produit'});}else{if(products.some(x=>x.sku.toLowerCase()===p.sku.toLowerCase())){toast('Cette référence existe déjà.');return}p.id=Date.now();products.push(p);movements.unshift({id:Date.now()+1,date:new Date().toISOString(),name:p.name,sku:p.sku,delta:p.qty,type:'Création produit',note:'Stock initial'});}save();closeModal();render();toast(editId?'Produit modifié':'Produit ajouté');});
function quickMove(id,delta){const p=products.find(x=>x.id===id);if(!p)return;if(delta<0&&p.qty===0){toast('Stock déjà à zéro');return}addMovement(p,delta,delta>0?'Entrée rapide':'Sortie rapide','Mouvement unitaire');render();toast(delta>0?'Une unité ajoutée':'Une unité retirée')}
function deleteProduct(id){const p=products.find(x=>x.id===id);if(!p)return;if(!confirm(`Supprimer "${p.name}" ?`))return;products=products.filter(x=>x.id!==id);save();render();toast('Produit supprimé')}
function exportCSV(){const lines=[['Nom','SKU','Catégorie','Emplacement','Prix','Quantité','Seuil','État'],...products.map(p=>[p.name,p.sku,p.cat,p.loc,p.price,p.qty,p.min,stockStatus(p)[0]])];const csv=lines.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='stockpilot-inventaire.csv';a.click();URL.revokeObjectURL(url);toast('Export CSV téléchargé')}
load();render();
</script>
</body></html>
